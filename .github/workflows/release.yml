name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 构建并打包
        run: bash scripts/build-release.sh

      - name: 上传产物为 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSleep-release
          path: build/release/

  publish:
    needs: build
    runs-on: macos-26
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: DeepSleep-release
          path: build/release/

      - name: 校验 zip 用 ditto 解（不能用 unzip）
        run: |
            /usr/bin/ditto -x -k build/release/DeepSleep.zip /tmp/ds-check
            /usr/bin/codesign --verify --deep --strict "/tmp/ds-check/Deep Sleep.app"

      - name: 解析 tag → 版本号
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: 校验产物版本号与 tag 一致
        run: |
            BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "/tmp/ds-check/Deep Sleep.app/Contents/Info.plist")
            if [ "$BUILT" != "${{ steps.ver.outputs.version }}" ]; then
              echo "版本不一致：tag=${{ steps.ver.outputs.version }} 产物=$BUILT" >&2
              exit 1
            fi

      - name: 写 release notes 占位文件
        run: |
            echo "## v${{ steps.ver.outputs.version }}" > release-notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
              build/release/DeepSleep.zip
              build/release/DeepSleep.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: false